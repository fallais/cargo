name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, cgo: 0 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, cgo: 0 }
          - { os: ubuntu-latest, goos: windows, goarch: amd64, cgo: 0, ext: .exe }
          # macOS binaries need cgo for the serial library, so they are built
          # on a macOS runner rather than cross-compiled from Linux. Both
          # architectures come off the Apple Silicon image: the Intel one by
          # pointing cgo at the x86_64 slice of the SDK, because no runner was
          # available for the retired Intel image.
          - { os: macos-latest, goos: darwin, goarch: arm64, cgo: 1 }
          - { os: macos-latest, goos: darwin, goarch: amd64, cgo: 1, arch: x86_64 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          CGO_CFLAGS: ${{ matrix.arch && format('-arch {0}', matrix.arch) || '' }}
          CGO_LDFLAGS: ${{ matrix.arch && format('-arch {0}', matrix.arch) || '' }}
        run: |
          name="cargo-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${name}"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/${name}/cargo${{ matrix.ext }}" .
          cp README.md LICENSE NOTICE "dist/${name}/"
          cd dist
          if [ "${GOOS}" = "windows" ]; then
            zip -r "${name}.zip" "${name}"
          else
            tar czf "${name}.tar.gz" "${name}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: cargo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
